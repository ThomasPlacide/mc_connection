apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcco-ingress
  annotations:
    spec.ingressClassName: "traefik"
    traefik.frontend.passHostHeader: "true"
    treafik.backend.loadbalancer.stickiness: "true"
spec:
  rules:
  - host: minecraft-server.com
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mcco-app-service
              port:
                number: 5000