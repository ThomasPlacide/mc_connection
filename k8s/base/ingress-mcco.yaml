apiVersion: extensions/v1beta1
kind: Ingress
metadata:
  name: mcco-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.frontend.passHostHeader: "true"
    treafik.backend.loadbalancer.stickiness: "true"
spec:
  rules:
  - host: minecraft-server.com
    http:
      paths:
        - path: /mcco
          backend:
            serviceName: mcco-app-service
            servicePort: 5000